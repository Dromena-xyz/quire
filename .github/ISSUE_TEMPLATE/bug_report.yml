name: Bug report
description: Something in Quire isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. For anything about your **license, activation, or a payment**, please reply to your purchase email instead, which reaches us privately. Don't paste your license key here.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I'm on the latest version of Quire.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
      placeholder: "When I..., Quire... but I expected..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen?
      placeholder: |
        1. Create a project with...
        2. Open a Galley of...
        3. ...
    validations:
      required: true
  - type: input
    id: quire-version
    attributes:
      label: Quire version
      description: "Settings then Quire (the version is shown under License)."
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: "Settings then About."
      placeholder: "e.g. 1.11.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Quire?
      options:
        - BRAT
        - Manual download
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Console errors or screenshots
      description: "Anything in the developer console (Cmd/Ctrl+Shift+I, then Console) or a screenshot helps. Again, no license keys."
    validations:
      required: false
